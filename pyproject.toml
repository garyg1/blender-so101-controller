[project]
name = "so101-blender"
version = "0.1.0"
description = "A simple demo of using the SO101 to control the camera in Blender."
readme = "README.md"
# lerobot strictly locked to 3.12
requires-python = "~=3.12.0"
dependencies = [
    "lerobot[feetech,placo-dep]>=0.6.1",
    "pyside6>=6.11.2",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
